name: Build and publish wheels

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Never cancel an in-flight publish: a half-completed release (tag pushed,
# artifact missing) is worse than two overlapping runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    name: "${{ matrix.platform.target }} ${{ matrix.build.name }} (${{ matrix.platform.os }})"
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto
          # Linux aarch64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: auto
          # Linux i686
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
            manylinux: auto
          # Linux armv7
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            manylinux: auto
          # Linux s390x
          - os: ubuntu-latest
            target: s390x-unknown-linux-gnu
            manylinux: auto
          # Linux ppc64le
          - os: ubuntu-latest
            target: powerpc64le-unknown-linux-gnu
            manylinux: auto
          # musllinux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_1
          # musllinux aarch64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_1
          # macOS x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
          # macOS aarch64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Windows i686
          - os: windows-latest
            target: i686-pc-windows-msvc
          # Windows aarch64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
        build:
          # The pyo3 dependency enables both abi3-py310 and abi3t-py315, so the
          # wheel each leg produces is selected by the interpreter it builds
          # against. Together these cover GIL CPython 3.10+ and all of 3.15+
          # (including free-threaded).
          #
          # GIL CPython 3.10-3.14: one abi3 wheel per platform.
          - name: abi3
            args: --interpreter 3.14
          # CPython 3.15+ (GIL and free-threaded): one abi3.abi3t wheel (PEP 803).
          - name: abi3t
            args: --interpreter 3.15t

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          args: --release --out dist ${{ matrix.build.args }}
          before-script-linux: |
            # Install OpenSSL development headers if needed
            if command -v apt-get &> /dev/null; then
              apt-get update && apt-get install -y libssl-dev
            elif command -v apk &> /dev/null; then
              apk add --no-cache openssl-dev
            fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.build.name }}-${{ matrix.platform.target }}
          path: dist/*.whl

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [sdist, wheels]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write # OIDC token for PyPI trusted publishing
    environment: pypi
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          PKG_VERSION=$(python3 -c "
          import tomllib
          with open('Cargo.toml', 'rb') as f:
              print(tomllib.load(f)['package']['version'])
          ")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${TAG} does not match Cargo.toml version ${PKG_VERSION}"
            exit 1
          fi

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # The abi3.abi3t wheels are built against a pre-release CPython 3.15, so we
      # build them (to keep them tested) but do not publish them yet. To start
      # publishing them once CPython 3.15 is released, delete this step.
      - name: Exclude pre-release 3.15 (abi3t) wheels from publication
        run: rm -fv dist/*abi3.abi3t*.whl

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/
