[package]
name = "tomledit"
version = "1.2.5"
edition = "2024"
license = "Apache-2.0 OR MIT"

[lib]
crate-type = ["cdylib"]
name = "tomledit"

[dependencies]
parking_lot = "0.12"
toml_edit = "0.25.9"
toml_parser = { version = "1.1.3", features = ["unsafe"] }

[dependencies.pyo3]
version = "0.29.1"
features = ["abi3-py311", "abi3t-py315", "parking_lot"]

[target.'cfg(not(any(target_arch = "arm", target_arch = "powerpc64", target_arch = "s390x")))'.dependencies.mimalloc]
version = "=0.1.52"
features = ["v2"]
optional = true

[features]
default = []
mimalloc = ["dep:mimalloc"]

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1

[profile.coverage]
inherits = "dev"
