[project]
strict = true
site_name = "tomledit"
site_description = "A format-preserving TOML editor for Python."
site_url = "https://dimbleby.github.io/tomledit/"
repo_url = "https://github.com/dimbleby/tomledit"
nav = [
  { Home = "index.md" },
  { Quickstart = "quickstart.md" },
  { "Working with items" = "working-with-items.md" },
  { Comments = "comments.md" },
  { "TOML layout" = "layout.md" },
  { "API reference" = "api.md" },
]

[project.extra]
generator = false

[project.theme]
features = [
  "content.code.copy",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.plugins.llmstxt.sections]
Documentation = ["*.md"]

[project.plugins.markdown-exec]
languages = ["python"]

[project.plugins.mkdocstrings.handlers.python.options]
allow_inspection = true
extensions = ["tools/docs_griffe.py:TomleditStubs"]
force_inspection = true
separate_signature = true
show_bases = false
show_labels = false
show_root_full_path = false
show_root_heading = true
show_signature_annotations = true
show_source = false
