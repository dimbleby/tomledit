name: Linting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actions-lock:
    name: Verify action lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify action lockfile
        run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}

  python:
    name: Python
    runs-on: ${{ matrix.image }}
    strategy:
      matrix:
        os:
          - Ubuntu
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.14t"
          - "3.15"
          - "3.15t"
        include:
          - os: Ubuntu
            image: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Check lockfile
        run: uv lock --check

      - name: Install project
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv sync -p "$PYTHON_VERSION"

      - name: Install ruff
        uses: astral-sh/ruff-action@v4.1.0

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: ty check
        run: uvx ty check

      - name: mypy
        run: uv run mypy

      - name: pytest
        run: uv run pytest

      - name: pytest (slow)
        run: uv run pytest -m slow

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python (needed by PyO3 for cargo test)
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.x"

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features
        env:
          LD_LIBRARY_PATH: ${{ env.pythonLocation }}/lib

  coverage:
    name: Rust coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install llvm-tools
        run: rustup component add llvm-tools

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.90.4
        with:
          tool: cargo-llvm-cov

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.x"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Build with coverage instrumentation and run tests
        env:
          MATURIN_PEP517_ARGS: --profile coverage
        run: |
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov clean --workspace
          uv run --reinstall-package tomledit pytest -q

      - name: Generate coverage report
        env:
          LLVM_COV_FLAGS: --show-branch-summary=false
        run: |
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov report --profile coverage
