[package]
name = "tomledit"
license = "Apache-2.0 OR MIT"
version = "1.2.2"
edition = "2024"

[lib]
name = "tomledit"
crate-type = ["cdylib"]

[dependencies]
parking_lot = "0.12"
toml_edit = "0.25.9"

[dependencies.pyo3]
version = "0.29.1"
features = ["abi3-py310", "abi3t-py315", "parking_lot"]

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"

[profile.coverage]
inherits = "dev"
